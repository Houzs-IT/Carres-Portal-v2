# Carres's copy of the Houzs supply chain engine (Houzs commit a87a841be, 5 Nov 2026), in CARRES's
# Cloudflare account. Rules, copied from the Conts engine that runs the same code:
#   - only Carres resources: never a Houzs database, bucket, queue, KV, domain or account;
#   - Houzs's scheduled jobs run (the [triggers] below, Houzs's own list) but no AutoCount job (AUTOCOUNT_SYNC_DISABLED),
#     no routes, no queues. Every mail they send goes to Carres addresses (Branding / CLIENT_ERROR_DIGEST_TO), never Houzs's;
#   - the database is the engine's OWN Supabase project, never Carres-Portal-v2: its tables share names
#     with Carres's (projects, purchase_orders, warehouses ...).
# The REPLACE_ME ids are filled once those Carres resources exist; until then a deploy fails on purpose.
name = "carres-scm-engine"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Variables set in the Cloudflare dashboard (IT_HUB_URL, IT_HUB_AI_USAGE_COMPANY, CLIENT_ERROR_DIGEST_TO ...) survive
# a deploy. Without this, every deploy deletes any variable not listed under [vars] below.
keep_vars = true

# Same as Houzs: the fetch handler runs in Singapore, next to the database, so a request's several database round
# trips stay short, and every Claude call (document reading, assistant) leaves from Singapore: Anthropic refuses some
# Cloudflare locations, Hong Kong among them. Pinned by tests/workerPlacementRegion.test.ts (Houzs's test).
[placement]
region = "aws:ap-southeast-1"

# Worker logs, as Houzs keeps them (Cloudflare dashboard > Workers > carres-scm-engine > Logs).
[observability]
enabled = true

[vars]
AUTOCOUNT_API_URL = "https://autocount.invalid/"
AUTOCOUNT_SYNC_DISABLED = "true"
# Stock posts in ONE database transaction (scm/lib/stock-post-tx.ts): "atomic" (default) or "two-step" (rollback switch).
GRN_POST_MODE = "atomic"
# DO ship / confirm (scm/lib/do-ship-atomic.ts): "atomic" (default) or "two-step" (rollback switch).
DO_SHIP_MODE = "atomic"
# Returns in one database transaction (scm/lib/stock-post-tx.ts): "atomic" (default) or "two-step" (rollback switch).
DELIVERY_RETURN_MODE = "atomic"
PURCHASE_RETURN_MODE = "atomic"
# Delivery Planning board reads (scm/lib/delivery-board-source.ts): "rest" (default), "shadow" or "sql".
DP_BOARD_SOURCE = "rest"
# Receipt bank move (acc/rebank-transaction.ts): "atomic" (default) or "two-step" (rollback switch).
RECEIPT_REBANK_MODE = "atomic"
COSTING_DISPLAY_ENABLED = "true"
SESSION_FALLBACK_ENABLED = "false"
SESSION_FALLBACK_TTL_MS = "60000"
HOUZS_OWNS_2990 = "true"
PUBLIC_APP_URL = "https://carres-portal.pages.dev"
# The engine's own site: the public pages a link must open (/survey/<token>, /invite/<token>, /reset/<token>,
# /portal/case/<token>) live here, not on the Carres portal.
ENGINE_PUBLIC_URL = "https://carres-scm.pages.dev"
# CLIENT_ERROR_DIGEST_TO (who gets the daily client-error digest) is set in the Cloudflare dashboard, not here, so a
# deploy does not blank it. Unset = the Settings > Branding email; neither set = no digest.
EMAIL_FROM = "Carres <noreply@carresofficial.com>"
SO_ITEM_PHOTOS_BUCKET_NAME = "carres-scm"
SENTRY_ENVIRONMENT = "production"
# Carres: the Carres portal API that Team > Invite Member, Set a new password and Disable account keep in step
# (src/carres/portal-staff.ts). Reached through the CARRES_PORTAL service binding below; this origin is the fallback.
CARRES_PORTAL_API = "https://api.carresofficial.com"

# Carres: the Carres portal API Worker, for staff portal logins made from Team (src/carres/portal-staff.ts). The
# portal binds back to this Worker as SCM_ENGINE (apps/api/wrangler.toml); a public call between two Workers of one
# account can be refused, so both directions go through a binding.
[[services]]
binding = "CARRES_PORTAL"
service = "carres-portal-v2-api"

# The engine's own Supabase project, connected as its own role (scm_engine). Caching off.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "5051c7e20a9b44afaa3523d296b651f0"

[[r2_buckets]]
binding = "POD_BUCKET"
bucket_name = "carres-scm"

[[r2_buckets]]
binding = "SO_ITEM_PHOTOS"
bucket_name = "carres-scm"

[[r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "carres-scm"

[[r2_buckets]]
binding = "SLIPS"
bucket_name = "carres-scm"

[[kv_namespaces]]
binding = "SESSION_CACHE"
id = "f11f807086f14251bd6fcdad0193129a"

# Houzs's cron schedule, unchanged (houzs-erp backend/wrangler.toml at origin/main). What each slot runs is in
# src/index.ts scheduled(); AutoCount jobs stay off (AUTOCOUNT_SYNC_DISABLED = "true", scm.autocount_writeback off),
# and jobs that need an outside service (Velocity, Connect, the IT hub, Venture Portal, Anthropic) do nothing
# until that service's secret or setting exists.
#   */5    keep-warm, email outbox, stock allocation sweep, amendment backstop
#   */15   MRP snapshot, procurement overview
#   */30   Service Case alerts, notice escalation, lead-time activations, 3PL bills, slip reaper, job alerts
#   0 2    daily batch: SLA, Service Case digest, project reminders, client-error digest, retention sweeps
#   5 16   month-end stock close (00:05 MYT), lorry day routes, DO stamp retry, nightly integrity / self-check
[triggers]
crons = [
  "*/5 * * * *",
  "*/15 * * * *",
  "*/30 * * * *",
  "0 2 * * *",
  "5 16 * * *"
]

[alias]
zod = "./node_modules/zod"
